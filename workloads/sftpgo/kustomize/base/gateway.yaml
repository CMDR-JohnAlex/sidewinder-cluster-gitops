---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute

metadata:
  name: sftpgo-https

spec:
  parentRefs:
    - name: primary-gateway
      namespace: envoy-gateway-system
      sectionName: https

  hostnames:
    - sftpgo.invalid.example

  rules:
    - backendRefs:
        - name: sftpgo-env # SVC name (internal IP:PORT).
          port: 80
      timeouts:
          request: 600s # 10 minute timeout for large files being uploaded.
          backendRequest: 600s # 10 minute timeout for large files being uploaded.
      matches:
        - path:
            type: PathPrefix
            value: /

---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute

metadata:
  name: sftpgo-http

spec:
  parentRefs:
    - name: primary-gateway
      namespace: envoy-gateway-system
      sectionName: http

  hostnames:
    - sftpgo.invalid.example

  rules:
    # - backendRefs:
    #     - name: sftpgo-env # SVC name (internal IP:PORT).
    #       port: 80
    #   matches:
    #     - path:
    #         type: PathPrefix
    #         value: /
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
