---
apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: jellyfin-prod
  namespace: argocd

spec:
  project: workloads

  sources:
    # Helm chart
    - repoURL: https://jellyfin.github.io/jellyfin-helm
      chart: jellyfin
      targetRevision: 3.3.0
      helm:
        valueFiles:
          - $values/workloads/jellyfin/values-common.yaml
          - $values/workloads/jellyfin/values/prod.yaml

    # Values repository
    - repoURL: https://github.com/CMDR-JohnAlex/sidewinder-cluster-gitops.git
      targetRevision: main
      ref: values

    # Extra resources - Kustomize
    - repoURL: https://github.com/CMDR-JohnAlex/sidewinder-cluster-gitops.git
      targetRevision: main
      path: workloads/jellyfin/resources/overlays/prod

  destination:
    server: https://kubernetes.default.svc
    namespace: jellyfin-prod

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=true
