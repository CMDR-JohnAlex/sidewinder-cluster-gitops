---
apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: forgejo
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io

spec:
  project: workloads

  sources:
    # Helm chart
    - repoURL: code.forgejo.org/forgejo-helm
      chart: forgejo
      targetRevision: '17.1.6'
      helm:
        valueFiles:
          - $values/workloads/forgejo/helm/values.yaml

    # Values repository
    - repoURL: https://github.com/CMDR-JohnAlex/sidewinder-cluster-gitops.git
      targetRevision: main
      ref: values

    # Kustomize
    - repoURL: https://github.com/CMDR-JohnAlex/sidewinder-cluster-gitops.git
      targetRevision: main
      path: workloads/forgejo/kustomize

  destination:
    server: https://kubernetes.default.svc
    namespace: git

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=true
