---
apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: nginx-dev
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io

spec:
  project: workloads

  sources:
    # Kustomize
    - repoURL: https://github.com/CMDR-JohnAlex/sidewinder-cluster-gitops.git
      targetRevision: main
      path: workloads/nginx/overlays/dev

  destination:
    server: https://kubernetes.default.svc
    namespace: nginx-dev

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - ServerSideApply=false
      - CreateNamespace=true
