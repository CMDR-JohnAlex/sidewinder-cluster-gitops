---
apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: nginx-prod
  namespace: argocd

spec:
  project: workloads

  sources:
    # Kustomize
    - repoURL: https://github.com/CMDR-JohnAlex/sidewinder-cluster-gitops.git
      targetRevision: main
      path: workloads/nginx/overlays/prod

  destination:
    server: https://kubernetes.default.svc
    namespace: nginx

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - ServerSideApply=false
      - CreateNamespace=true
