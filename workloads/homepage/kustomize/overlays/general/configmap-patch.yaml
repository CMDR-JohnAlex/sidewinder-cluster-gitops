---
apiVersion: v1
kind: ConfigMap

metadata:
  name: homepage

  labels:
    app.kubernetes.io/name: homepage

data:
  kubernetes.yaml: |
    mode: disabled

  settings.yaml: |
    title: Sidewinder Cluster
    description: Sidewinder Cluster's Homepage
    # favicon: <URL or PATH>

    # TODO: https://gethomepage.dev/configs/settings/#background-image
    # TODO: https://gethomepage.dev/configs/settings/#background-opacity-filters
    # TODO: https://gethomepage.dev/configs/settings/#card-background-blur

    # TODO: https://gethomepage.dev/configs/settings/#progressive-web-app-pwa

    layout:
      Cluster & Docs:
        style: row
        columns: 3
      Media & Entertainment:
        style: row
        columns: 4
      Arr Stack:
        style: row
        columns: 4
      Productivity:
        style: row
        columns: 3
      Home & Network:
        style: row
        columns: 4
      Social:
        style: row
        columns: 2

  custom.css: ""
  custom.js: ""

  bookmarks.yaml: |
    - Useful Links:
      - Kubernetes Docs:
        - abbr: K8s
          href: https://kubernetes.io/docs/home
      - Arch Linux Wiki:
        - abbr: Arch
          href: https://wiki.archlinux.org
    - Developer:
      - Github:
        - abbr: GH
          href: https://github.com

  services.yaml: |
    - Cluster & Docs:
      - Cluster Documentation:
        icon: nginx.svg
        href: https://docs.sidewinder.lan
        siteMonitor: https://docs.sidewinder.lan
        description: "Read me first! Guides & Info."
      - Grafana:
        icon: grafana.svg
        href: https://grafana.sidewinder.lan
        siteMonitor: https://grafana.sidewinder.lan
        description: "Monitor the Kubernetes cluster."
      - Ntfy:
        icon: ntfy.svg
        href: https://ntfy.sidewinder.lan
        siteMonitor: https://ntfy.sidewinder.lan
        description: "Cluster announcements and alerts."

    - Media & Entertainment:
      - Jellyfin:
        icon: jellyfin.svg
        href: https://jellyfin.sidewinder.lan
        siteMonitor: https://jellyfin.sidewinder.lan
        description: "Watch movies and TV shows."
      - Navidrome:
        icon: navidrome.svg
        href: https://navidrome.sidewinder.lan
        siteMonitor: https://navidrome.sidewinder.lan
        description: "Listen to our music library."
      - Feishin:
        icon: feishin.svg
        href: https://feishin.sidewinder.lan
        siteMonitor: https://feishin.sidewinder.lan
        description: "Beautiful Web UI for Navidrome."
      - Immich:
        icon: immich.svg
        href: https://immich.sidewinder.lan
        siteMonitor: https://immich.sidewinder.lan
        description: "Family photo and video backups."
      - Minecraft Server:
        icon: minecraft.svg
        href: https://mc.sidewinder.lan
        ping: mc.sidewinder.lan:25565
        description: "Family Minecraft Server."

    - Arr Stack:
      #
      - EMPTY 1:
        href: https://homepage.sidewinder.lan
        description: "Placeholder."

    - Productivity:
      # Vikunja
      # Forgejo
      # SFTPGo
      - EMPTY 2:
        href: https://homepage.sidewinder.lan
        description: "Placeholder."

    - Home & Network:
      # Home Assistant
      # Pi-Hole
      # AdGuard Home
      # Technitium
      - EMPTY 3:
        href: https://homepage.sidewinder.lan
        description: "Placeholder."

    - Social:
      # Matrix
      # Mastodon
      - EMPTY 4:
        href: https://homepage.sidewinder.lan
        description: "Placeholder."

  widgets.yaml: |
    - logo:
      icon: homepage.svg

    - greeting:
      text_size: xl
      text: Sidewinder Cluster

    - search:
        provider: duckduckgo
        target: _blank

    - datetime:
      text_size: xl
      format:
        timeStyle: short
        hourCycle: h23

  docker.yaml: ""
  proxmox.yaml: ""
