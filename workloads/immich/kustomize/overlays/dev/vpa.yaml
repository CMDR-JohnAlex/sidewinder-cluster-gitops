---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler

metadata:
  name: immich-dev-server

spec:
  targetRef:
    apiVersion: "apps/v1"
    kind: Deployment
    name: immich-dev-server

  updatePolicy:
    updateMode: "Off"

---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler

metadata:
  name: immich-dev-valkey

spec:
  targetRef:
    apiVersion: "apps/v1"
    kind: Deployment
    name: immich-dev-valkey

  updatePolicy:
    updateMode: "Off"

