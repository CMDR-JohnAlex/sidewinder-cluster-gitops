---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute

metadata:
  name: jellyfin-https

spec:
  parentRefs:
    - name: primary-gateway
      namespace: envoy-gateway-system
      sectionName: https

  hostnames:
    - jellyfin.invalid.example

  rules:
    - backendRefs:
        - name: jellyfin-svc # SVC name (internal IP:PORT).
          port: 8096
      matches:
        - path:
            type: PathPrefix
            value: /

---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute

metadata:
  name: jellyfin-http

spec:
  parentRefs:
    - name: primary-gateway
      namespace: envoy-gateway-system
      sectionName: http

  hostnames:
    - jellyfin.invalid.example

  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301

---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute

metadata:
  name: jellyfin-http-via-jellyfin-port

spec:
  parentRefs:
    - name: primary-gateway
      namespace: envoy-gateway-system
      sectionName: jellyfin

  rules:
    - backendRefs:
        - name: jellyfin-svc # SVC name (internal IP:PORT).
          port: 8096
      matches:
        - path:
            type: PathPrefix
            value: /
