---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute

metadata:
  name: jellyfin-https

spec:
  hostnames:
    - jellyfin.sidewinder.lan

# WARN: When updating to 3.3.0, see issue: https://github.com/jellyfin/jellyfin-helm/issues/133
# TEMP: This is temporary until we update to 3.3.0
  rules:
    - backendRefs:
        - name: jellyfin-prod # SVC name (internal IP:PORT).
          port: 8096
      matches:
        - path:
            type: PathPrefix
            value: /

---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute

metadata:
  name: jellyfin-http

spec:
  hostnames:
    - jellyfin.sidewinder.lan

---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute

metadata:
  name: jellyfin-http-via-jellyfin-port

spec:
  rules:
    - backendRefs:
        - name: jellyfin-prod # SVC name (internal IP:PORT).
          port: 8096
      matches:
        - path:
            type: PathPrefix
            value: /
