---
# -- Number of Jellyfin replicas to start. Should be left at 1.
replicaCount: 1

# -- Resource requests and limits for the Jellyfin container.
resources: {}
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

# TODO: Look into node labels and nodeSelector/nodeAffinity to better tell Kubernetes which node(s) to schedule workloads on.
# Could have node labels for the device (such as "Rpi4B"/"Rpi5") or certain jobs/roles like "transcoder" if it is good at transcoding on the fly.
# If I ever get into ML and AI stuff, a node label could be applied to nodes with good GPUs for it.
affinity:
  nodeAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      # Prefer nodes with GPU and jellyfin-transcoding labels.
      - weight: 100
        preference:
          matchExpressions:
            - key: hardware.sidewinder.lan/gpu
              operator: In
              values:
                - "true"
            - key: capability.sidewinder.lan/jellyfin-transcoding
              operator: In
              values:
                - "true"

      # Second, prefer jellyfin-transcoding label.
      - weight: 90
        preference:
          matchExpressions:
            - key: capability.sidewinder.lan/jellyfin-transcoding
              operator: In
              values:
                - "true"

      # Finally, prefer certain nodes.
      - weight: 80
        preference:
          matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - hauler-01
                - sidewinder-08
