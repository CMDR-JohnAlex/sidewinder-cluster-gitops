---
# -- Number of Jellyfin replicas to start. Should be left at 1.
replicaCount: 0

# -- Resource requests and limits for the Jellyfin container.
resources: {}
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

# ---
# REF: https://kubernetes.io/docs/concepts/workloads/pods/probes/
# ---

# -- Configure startup probe for Jellyfin.
# This probe gives Jellyfin enough time to start, especially with large media libraries.
# After the startup probe succeeds once, liveness and readiness probes take over.
startupProbe:
  tcpSocket:
    port: http
  initialDelaySeconds: 0
  periodSeconds: 10
  failureThreshold: 60
  timeoutSeconds: 5
  # 10 minutes (failureThreshold=60 * periodSeconds=10) to start.
  # 5 seconds to reply.

# -- Configure liveness probe for Jellyfin.
# This probe is disabled during startup (startup probe handles initial checks).
# Uses httpGet for compatibility with both IPv4 and IPv6.
livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 10
  periodSeconds: 30
  failureThreshold: 5
  # So if Jellyfin fails to reply to 5 requests in a row, it gets killed.
  # That means 2.5 minutes (30s * 5s) of appearing dead before it gets restarted.
  timeoutSeconds: 10
  # Things are slow with this cluster and when Jellyfin is busy, things get even slower. Thus, timeout is increased.

# -- Configure readiness probe for Jellyfin.
# This probe is disabled during startup (startup probe handles initial checks).
# Uses httpGet for compatibility with both IPv4 and IPv6.

# > "To start sending traffic to a Pod only when a probe succeeds, specify a readiness probe.
# > The readiness probe might be the same as the liveness probe, but the existence of the readiness
# > probe in the spec means that the Pod will start without receiving any traffic and only start
# > receiving traffic after the probe starts succeeding."

# I've just set it to be the same as the liveness probe. I don't have and can't have replicas
# for this deployment, so this doesn't have much of a use. Right?
readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 10
  periodSeconds: 30
  failureThreshold: 5
  timeoutSeconds: 10

# TODO: Look into node labels and nodeSelector/nodeAffinity to better tell Kubernetes which node(s) to schedule workloads on.
# Could have node labels for the device (such as "Rpi4B"/"Rpi5") or certain jobs/roles like "transcoder" if it is good at transcoding on the fly.
# If I ever get into ML and AI stuff, a node label could be applied to nodes with good GPUs for it.
affinity:
  nodeAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
    - weight: 100
      preference:
        matchExpressions:
        - key: kubernetes.io/hostname
          operator: In
          values:
          - sidewinder-08
