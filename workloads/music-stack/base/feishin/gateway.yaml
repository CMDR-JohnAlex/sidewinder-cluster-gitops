---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute

metadata:
  name: feishin-https

spec:
  parentRefs:
    - name: primary-gateway
      namespace: envoy-gateway-system
      sectionName: https

  hostnames:
    - feishin.invalid.example

  rules:
    - backendRefs:
        - name: feishin-svc # SVC name (internal IP:PORT).
          port: 80
      matches:
        - path:
            type: PathPrefix
            value: /

---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute

metadata:
  name: feishin-http

spec:
  parentRefs:
    - name: primary-gateway
      namespace: envoy-gateway-system
      sectionName: http

  hostnames:
    - feishin.invalid.example

  rules:
    - backendRefs:
        - name: feishin-svc # SVC name (internal IP:PORT).
          port: 80
      matches:
        - path:
            type: PathPrefix
            value: /
