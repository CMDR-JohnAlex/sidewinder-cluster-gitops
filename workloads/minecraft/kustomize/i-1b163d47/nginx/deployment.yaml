---
apiVersion: apps/v1
kind: Deployment

metadata:
  name: nginx-i-1b163d47-deployment
  labels:
    app: nginx-i-1b163d47-deployment

spec:
  replicas: 1

  selector:
    matchLabels:
      app: nginx-i-1b163d47-pod

  template:
    metadata:
      labels:
        app: nginx-i-1b163d47-pod

    spec:
      containers:
        - name: nginx
          image: nginx:alpine

          ports:
            - containerPort: 80
              name: nginx-http

          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html

            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf

      volumes:
        - name: html
          persistentVolumeClaim:
            claimName: nginx-i-1b163d47-data

        - name: nginx-config
          configMap:
            name: nginx-config-i-1b163d47
