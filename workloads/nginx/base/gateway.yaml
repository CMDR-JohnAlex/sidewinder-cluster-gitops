---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute

metadata:
  name: nginx-http

spec:
  parentRefs:
    - name: primary-gateway
      namespace: envoy-gateway-system
      sectionName: http

  hostnames:
    - nginx.invalid.example

  rules:
    - backendRefs:
        - name: nginx-svc # SVC name (internal IP:PORT).
          port: 80 # External port through main-gateway.
      matches:
        - path:
            type: PathPrefix
            value: /

---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute

metadata:
  name: nginx-https

spec:
  parentRefs:
    - name: primary-gateway
      namespace: envoy-gateway-system
      sectionName: https

  hostnames:
    - nginx.invalid.example

  rules:
    - backendRefs:
        - name: nginx-svc # SVC name (internal IP:PORT).
          port: 80 # External port through main-gateway.
      matches:
        - path:
            type: PathPrefix
            value: /
