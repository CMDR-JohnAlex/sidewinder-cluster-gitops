---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: nginx-prod

resources:
  - ../../base

patches:
  - path: deployment-patch.yaml
  - path: pvc-patch.yaml
  - path: gateway-patch.yaml

configMapGenerator:
    - name: nginx-config
      files:
        - default.conf

labels:
  - pairs:
      instance: prod
    includeSelectors: false
    includeTemplates: true
