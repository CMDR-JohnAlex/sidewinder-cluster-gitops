---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: infrastructure-apps
  namespace: argocd
spec:
  project: infrastructure
  source:
    repoURL: https://github.com/CMDR-JohnAlex/sidewinder-cluster-gitops.git
    targetRevision: main
    path: infrastructure/applications
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
