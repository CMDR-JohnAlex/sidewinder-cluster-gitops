---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: workload-apps
  namespace: argocd
spec:
  project: workloads
  source:
    repoURL: https://github.com/CMDR-JohnAlex/sidewinder-cluster-gitops.git
    targetRevision: main
    path: workloads/applications
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
