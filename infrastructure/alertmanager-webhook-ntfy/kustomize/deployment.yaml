---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager-webhook-ntfy-deployment
  labels:
    app: alertmanager-webhook-ntfy-deployment
spec:
  revisionHistoryLimit: 1
  replicas: 2
  selector:
    matchLabels:
      app: alertmanager-webhook-ntfy-pod
  template:
    metadata:
      labels:
        app: alertmanager-webhook-ntfy-pod
    spec:
      containers:
        - name: alertmanager-webhook-ntfy
          image: ghcr.io/cmdr-johnalex/alertmanager-webhook-ntfy:latest
          envFrom:
            - secretRef:
                name: alertmanager-webhook-ntfy-env-secrets
          ports:
            - containerPort: 8080
              name: http-webhook
          resources:
            limits:
              cpu:  5.5m
              memory: 100Mi
            requests:
                cpu: 4.5m
                memory: 95Mi
          volumeMounts:
            - mountPath: /usr/src/app/config.yaml
              subPath: config.yaml
              name: config-volume
      volumes:
        - name: config-volume
          configMap:
            name: routing-config
