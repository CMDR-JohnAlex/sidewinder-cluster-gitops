---
apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: kubelet-csr-approver
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io

spec:
  project: infrastructure

  sources:
    # Helm chart
    - repoURL: https://postfinance.github.io/kubelet-csr-approver
      chart: kubelet-csr-approver
      targetRevision: '1.2.15'
      helm:
        valueFiles:
          - $values/infrastructure/kubelet-csr-approver/helm/values.yaml

    # Values repository
    - repoURL: https://github.com/CMDR-JohnAlex/sidewinder-cluster-gitops.git
      targetRevision: main
      ref: values

    # Kustomize
    # - repoURL: https://github.com/CMDR-JohnAlex/sidewinder-cluster-gitops.git
    #   targetRevision: main
    #   path: infrastructure/kubelet-csr-approver/kustomize

  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=true
