---
apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: kubeinvaders
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io

spec:
  project: infrastructure

  sources:
    # Kustomize
    - repoURL: https://github.com/CMDR-JohnAlex/sidewinder-cluster-gitops.git
      targetRevision: main
      path: infrastructure/kubeinvaders/kustomize

  destination:
    server: https://kubernetes.default.svc
    namespace: kubeinvaders

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=true
