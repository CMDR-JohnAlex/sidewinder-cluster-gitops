---
apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: gateway
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io

spec:
  project: infrastructure

  sources:
    # Helm chart
    - repoURL: docker.io/envoyproxy
      chart: gateway-helm
      targetRevision: v1.8.1

    # Resources
    - repoURL: https://github.com/CMDR-JohnAlex/sidewinder-cluster-gitops.git
      targetRevision: main
      path: infrastructure/gateway/kustomize

  destination:
    server: https://kubernetes.default.svc
    namespace: envoy-gateway-system

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=true
