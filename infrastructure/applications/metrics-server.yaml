---
apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: metrics-server
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io

spec:
  project: infrastructure

  sources:
    # Helm chart
    - repoURL: https://kubernetes-sigs.github.io/metrics-server
      chart: metrics-server
      targetRevision: '3.14.0'
      helm:
        valueFiles:
          - $values/infrastructure/metrics-server/helm/values.yaml

    # Values repository
    - repoURL: https://github.com/CMDR-JohnAlex/sidewinder-cluster-gitops.git
      targetRevision: main
      ref: values

    # Kustomize
    # - repoURL: https://github.com/CMDR-JohnAlex/sidewinder-cluster-gitops.git
    #   targetRevision: main
    #   path: infrastructure/metrics-server/kustomize

  destination:
    server: https://kubernetes.default.svc
    namespace: metrics-server

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=true
