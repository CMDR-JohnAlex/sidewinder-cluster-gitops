---
apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: alertmanager-ntfy
  namespace: argocd

spec:
  project: infrastructure

  sources:
    # Kustomize
    - repoURL: https://github.com/CMDR-JohnAlex/sidewinder-cluster-gitops.git
      targetRevision: main
      path: infrastructure/alertmanager-ntfy/

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=true
