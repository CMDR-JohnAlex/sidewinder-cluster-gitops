---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ntfy-deployment.yaml # deployment definition
  - ntfy-svc.yaml # service connecting pods to cluster network
  - ntfy-pvc.yaml # pvc used to store cache and attachment
  - ntfy-gateway.yaml

  - ntfy-sealedsecret.yaml # Contains secrets that are not present in the config map.

  # - prometheus-rules/testing-rules.yaml

configMapGenerator:
    - name: server-config
      files:
        - server.yml
