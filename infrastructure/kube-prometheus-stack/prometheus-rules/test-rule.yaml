---
# https://prometheus-operator.dev/docs/api-reference/api/#monitoring.coreos.com/v1.PrometheusRule
# https://prometheus.io/docs/prometheus/latest/querying/basics/
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule

metadata:
  name: alertmanager-test
  namespace: monitoring
  labels: # Prometheus has a "ruleSelector" that "matchLabels" with "release: kube-prometheus-stack".
    release: kube-prometheus-stack

spec:
  groups:
    - name: alertmanager-test
      rules:
        - alert: AlertmanagerTest
          expr: vector(1) # Makes the alert always fire as it evaluates as 1.
          for: 1m # Expression must remain active/pending for 1 minute before being marked as FIRING.
          labels:
            severity: warning
            namespace: monitoring # NOTE: Must match the namespace of the PrometheusRule. REQUIRED!
          annotations:
            summary: Alertmanager test
            description: This is a test alert. Be afraid!
