---
apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: ntfy-forwarder
  namespace: kube-system

spec:
  route:
    receiver: 'ntfy-webhook'

    groupBy: ['alertname', 'namespace']

    groupWait: 30s
    groupInterval: 5m
    repeatInterval: 12h

  receivers:
    - name: 'ntfy-webhook'
      webhookConfigs:
        - url: 'http://alertmanager-ntfy-svc.monitoring.svc.cluster.local:8080/hook'
          sendResolved: true

