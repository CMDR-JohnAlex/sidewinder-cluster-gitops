---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy

metadata:
  name: primary-gateway-proxy
  namespace: envoy-gateway-system

spec:
  provider:
    type: Kubernetes

    kubernetes:
      envoyService:
        type: LoadBalancer
        loadBalancerIP: 192.168.7.100

        annotations:
          metallb.io/address-pool: "gateway-pool"

---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway

metadata:
  name: primary-gateway
  namespace: envoy-gateway-system

  annotations:
    cert-manager.io/cluster-issuer: sidewinder-ca

spec:
  gatewayClassName: envoy-gateway

  infrastructure:
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: primary-gateway-proxy

  listeners:
    - name: http
      protocol: HTTP
      port: 80
      hostname: "*.sidewinder.lan"
      allowedRoutes:
        namespaces:
          from: All

    - name: https
      protocol: HTTPS
      port: 443
      hostname: "*.sidewinder.lan"
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: sidewinder-lan-tls

    - name: http-alt
      protocol: HTTP
      port: 8080
      hostname: "*.sidewinder.lan"
      allowedRoutes:
        namespaces:
          from: All
